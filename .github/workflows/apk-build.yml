name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Pastikan package-lock.json ada (build harus reprodusibel)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json belum ada. Jalankan dulu workflow 'Buat package-lock.json' (tab Actions), lalu build ulang."
            exit 1
          fi
      - name: Pastikan secret kunci RELEASE sudah diisi
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, dan RELEASE_KEY_ALIAS harus diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx --no-install cap add android
      - name: Patch Android (minSdk + modul scanner)
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' android/variables.gradle
          sed -i 's#</application>#<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -n "barcode_ui" android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml
      - name: Pasang plugin native WhatsApp
        run: cp native/*.java android/app/src/main/java/id/toko/pos/
      - run: npx --no-install cap sync android
      - run: chmod +x android/gradlew
      - name: Build APK release (belum bertanda tangan)
        run: ./gradlew assembleRelease
        working-directory: android
      - name: Tanda tangani APK dengan kunci release
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "Build-tools: $BT"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK mentah: $IN"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out POS-Toko-release.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs POS-Toko-release.apk
          if "$BT/aapt2" dump badging POS-Toko-release.apk | grep -q "application-debuggable"; then
            echo "::error::APK masih debuggable"; exit 1
          fi
          echo "OK: APK release, bertanda tangan, tidak debuggable"
      - uses: actions/upload-artifact@v7
        with:
          name: POS-Toko-release
          path: POS-Toko-release.apk
